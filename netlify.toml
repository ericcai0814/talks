[build]
publish = "dist"
command = "pnpm run build"

[build.environment]
NODE_VERSION = "22"
PLAYWRIGHT_BROWSERS_PATH = "0"

[[redirects]]
from = "/.well-known/*"
to = "/.well-known/:splat"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[redirects]]
from = "2025-07-31"
to = "/2025/vuetify-design-system-integration/"
status = 301

[[redirects]]
from = "2025-07-01"
to = "/2025/frontend-testing/"
status = 301